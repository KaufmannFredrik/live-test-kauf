<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1c0f05">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍺</text></svg>">
<title>Bar Ratinger — GUTTA</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<main class="page-fade">
  <h1 class="page-title center">🏙️ Bar Ratinger</h1>
  <p class="page-lead center">
    Oslo eller Trondheim — hvor var utestedet som endte i legendarisk kaos? Rangér og del med gutta.
  </p>

  <form class="rate-form" id="barForm">
    <label>Navn på bar/utested</label>
    <input type="text" id="barName" placeholder="F.eks. Beer Palace, Den Gode Nabo..." required>

    <label>By</label>
    <select id="barCity">
      <option value="Oslo">Oslo</option>
      <option value="Trondheim">Trondheim</option>
    </select>

    <label>Vurdering</label>
    <div class="stars" id="barStars">
      <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
    </div>

    <label>Kommentar</label>
    <textarea id="barComment" rows="3" placeholder="Stemning, køen, ølprisen, dama/gutten i baren, dansegulvet..."></textarea>

    <button type="submit" class="btn small">🏙️ Legg til bar</button>
  </form>

  <section style="text-align:center;">
    <h2 style="color:var(--amber);">Alle barer</h2>
    <div class="size-picker" id="cityFilter">
      <button class="active" data-city="Alle">Alle byer</button>
      <button data-city="Oslo">Oslo</button>
      <button data-city="Trondheim">Trondheim</button>
    </div>
    <div class="entry-list" id="barList"></div>
  </section>
</main>

<footer>
  <p>🍺 GUTTA.NO — barhopping siden i går kveld.</p>
</footer>

<script src="js/common.js"></script>
<script>
let currentRating = 0;
let currentFilter = 'Alle';
const starsEl = document.getElementById('barStars');
starsEl.querySelectorAll('span').forEach(star => {
  star.addEventListener('click', () => {
    currentRating = parseInt(star.dataset.v);
    updateStars();
  });
  star.addEventListener('mouseenter', () => {
    starsEl.querySelectorAll('span').forEach(s => {
      s.classList.toggle('filled', parseInt(s.dataset.v) <= parseInt(star.dataset.v));
    });
  });
});
starsEl.addEventListener('mouseleave', updateStars);
function updateStars() {
  starsEl.querySelectorAll('span').forEach(s => {
    s.classList.toggle('filled', parseInt(s.dataset.v) <= currentRating);
  });
}

document.querySelectorAll('#cityFilter button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#cityFilter button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.city;
    renderBars();
  });
});

document.getElementById('barForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = document.getElementById('barName').value.trim();
  if (!name) return;
  if (currentRating === 0) { showToast("Gi baren en stjernevurdering! ⭐"); return; }

  const bar = {
    name,
    city: document.getElementById('barCity').value,
    rating: currentRating,
    comment: document.getElementById('barComment').value.trim(),
    date: new Date().toLocaleDateString('nb-NO')
  };

  const bars = Store.get('gutta_bars', []);
  bars.unshift(bar);
  Store.set('gutta_bars', bars);

  e.target.reset();
  currentRating = 0;
  updateStars();
  renderBars();
  showToast(`${name} lagt til! 🏙️`);
  if (bars.length >= 3) Achievements.unlock('bar_rater');
  GuttaSFX.glassClink();
  confettiBurst();
});

function deleteBar(i) {
  const bars = Store.get('gutta_bars', []);
  bars.splice(i, 1);
  Store.set('gutta_bars', bars);
  renderBars();
}

function renderBars() {
  let bars = Store.get('gutta_bars', []).map((b, i) => ({ ...b, _idx: i }));
  if (currentFilter !== 'Alle') bars = bars.filter(b => b.city === currentFilter);

  const list = document.getElementById('barList');
  list.innerHTML = '';
  if (bars.length === 0) {
    list.innerHTML = '<p style="text-align:center; opacity:0.6;">Ingen barer registrert ennå. Legg til den første! 🏙️</p>';
    return;
  }
  bars.forEach(b => {
    const div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML = `
      <div>
        <strong style="color:var(--amber); font-size:1.1rem;">${escapeHtml(b.name)}</strong>
        <span style="opacity:0.7;"> — ${b.city === 'Oslo' ? '🏛️' : '🎓'} ${escapeHtml(b.city)}</span><br>
        <span>${'★'.repeat(b.rating)}${'☆'.repeat(5-b.rating)}</span>
        ${b.comment ? `<p style="margin:6px 0 0; opacity:0.85;">"${escapeHtml(b.comment)}"</p>` : ''}
        <div class="meta">${b.date}</div>
      </div>
      <button class="del-btn" onclick="deleteBar(${b._idx})">Slett</button>
    `;
    list.appendChild(div);
  });
}
renderBars();
</script>
</body>
</html>
