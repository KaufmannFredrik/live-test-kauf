<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1c0f05">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍺</text></svg>">
<title>Øl Ratings — GUTTA</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<main class="page-fade">
  <h1 class="page-title center">🍺 Øl Ratings</h1>
  <p class="page-lead center">
    Har du akkurat drukket noe fantastisk (eller forferdelig)? Registrer det for ettertiden. Vitenskapelig presisjon er valgfritt.
  </p>

  <form class="rate-form" id="beerForm">
    <label>Navn på øl</label>
    <input type="text" id="beerName" placeholder="F.eks. Ringnes Pilsner, Dahls, Nøgne Ø..." required>

    <label>Bryggeri</label>
    <input type="text" id="beerBrewery" placeholder="F.eks. Ringnes, Hansa, Mack...">

    <label>Type</label>
    <select id="beerType">
      <option>Pils</option>
      <option>IPA</option>
      <option>Lager</option>
      <option>Stout</option>
      <option>Weissbier</option>
      <option>Sur øl</option>
      <option>Cider</option>
      <option>Annet</option>
    </select>

    <label>Vurdering</label>
    <div class="stars" id="beerStars">
      <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
    </div>

    <label>Kommentar</label>
    <textarea id="beerComment" rows="3" placeholder="Smaksnotater fra en ekspert (deg, kl 23:47)..."></textarea>

    <button type="submit" class="btn small">🍻 Legg til rating</button>
  </form>

  <section>
    <h2 style="color:var(--amber); text-align:center;">Alle ratings</h2>
    <div style="text-align:center; margin-bottom:10px;">
      <label class="range-slider-label">Sorter: </label>
      <select id="sortSelect" class="sort-select" onchange="renderBeers()">
        <option value="new">Nyeste først</option>
        <option value="high">Høyest rangert</option>
        <option value="low">Lavest rangert</option>
      </select>
    </div>
    <div class="entry-list" id="beerList"></div>
  </section>
</main>

<footer>
  <p>🍺 GUTTA.NO — smaksdommer avsagt med (u)pålitelig presisjon.</p>
</footer>

<script src="js/common.js"></script>
<script>
let currentRating = 0;
const starsEl = document.getElementById('beerStars');
starsEl.querySelectorAll('span').forEach(star => {
  star.addEventListener('click', () => {
    currentRating = parseInt(star.dataset.v);
    updateStars();
  });
  star.addEventListener('mouseenter', () => {
    starsEl.querySelectorAll('span').forEach(s => {
      s.classList.toggle('filled', parseInt(s.dataset.v) <= parseInt(star.dataset.v));
    });
  });
});
starsEl.addEventListener('mouseleave', updateStars);
function updateStars() {
  starsEl.querySelectorAll('span').forEach(s => {
    s.classList.toggle('filled', parseInt(s.dataset.v) <= currentRating);
  });
}

document.getElementById('beerForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = document.getElementById('beerName').value.trim();
  if (!name) return;
  if (currentRating === 0) { showToast("Gi den en stjernevurdering! ⭐"); return; }

  const beer = {
    name,
    brewery: document.getElementById('beerBrewery').value.trim() || 'Ukjent bryggeri',
    type: document.getElementById('beerType').value,
    rating: currentRating,
    comment: document.getElementById('beerComment').value.trim(),
    date: new Date().toLocaleDateString('nb-NO')
  };

  const beers = Store.get('gutta_beers', []);
  beers.unshift(beer);
  Store.set('gutta_beers', beers);

  e.target.reset();
  currentRating = 0;
  updateStars();
  renderBeers();
  showToast(`${name} lagt til! 🍺`);
  if (beers.length >= 5) Achievements.unlock('beer_rater');
  GuttaSFX.beerCrack();
  confettiBurst();
});

function deleteBeer(i) {
  const beers = Store.get('gutta_beers', []);
  beers.splice(i, 1);
  Store.set('gutta_beers', beers);
  renderBeers();
}

function renderBeers() {
  let beers = Store.get('gutta_beers', []);
  const sort = document.getElementById('sortSelect').value;
  const original = beers.map((b, i) => ({ ...b, _idx: i }));
  if (sort === 'high') original.sort((a,b) => b.rating - a.rating);
  if (sort === 'low') original.sort((a,b) => a.rating - b.rating);

  const list = document.getElementById('beerList');
  list.innerHTML = '';
  if (original.length === 0) {
    list.innerHTML = '<p style="text-align:center; opacity:0.6;">Ingen ratings ennå. Vær den første! 🍺</p>';
    return;
  }
  original.forEach(b => {
    const div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML = `
      <div>
        <strong style="color:var(--amber); font-size:1.1rem;">${escapeHtml(b.name)}</strong>
        <span style="opacity:0.7;"> — ${escapeHtml(b.brewery)} (${escapeHtml(b.type)})</span><br>
        <span>${'★'.repeat(b.rating)}${'☆'.repeat(5-b.rating)}</span>
        ${b.comment ? `<p style="margin:6px 0 0; opacity:0.85;">"${escapeHtml(b.comment)}"</p>` : ''}
        <div class="meta">${b.date}</div>
      </div>
      <button class="del-btn" onclick="deleteBeer(${b._idx})">Slett</button>
    `;
    list.appendChild(div);
  });
}
renderBeers();
</script>
</body>
</html>
